<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申し込み完了 | 新松戸後打ち上げ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --navy: #1a2744; --gold: #c9952a; --gold-light: #f0d07a; --cream: #fdf8ef; --cream-dark: #f4ead8; --text-muted: #6b7a99; }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--cream); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
  .page { width: 100%; max-width: 480px; }
  .header { text-align: center; margin-bottom: 2rem; }
  .check-circle { width: 64px; height: 64px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
  .check-circle svg { width: 32px; height: 32px; stroke: white; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .header h1 { font-family: 'Shippori Mincho', serif; font-size: 1.1rem; font-weight: 500; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 0.25rem; }
  .header h2 { font-family: 'Shippori Mincho', serif; font-size: 1.6rem; font-weight: 700; color: var(--navy); letter-spacing: 0.05em; }
  .card { background: white; border-radius: 12px; overflow: hidden; border: 1px solid var(--cream-dark); margin-bottom: 1rem; }
  .card-section { padding: 1.25rem 1.5rem; }
  .card-section + .card-section { border-top: 1px solid var(--cream-dark); }
  .section-label { font-size: 0.7rem; font-weight: 700; color: var(--gold); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.75rem; }
  .event-name { font-family: 'Shippori Mincho', serif; font-size: 1.25rem; font-weight: 700; color: var(--navy); margin-bottom: 0.75rem; }
  .event-meta { display: flex; flex-direction: column; gap: 0.4rem; }
  .meta-row { display: flex; align-items: center; gap: 0.6rem; font-size: 0.9rem; color: var(--text-muted); }
  .meta-row svg { width: 14px; height: 14px; stroke: var(--gold); stroke-width: 2; fill: none; flex-shrink: 0; }
  .member-label { font-size: 0.7rem; font-weight: 700; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 0.75rem; }
  .info-grid { display: flex; flex-direction: column; gap: 0.75rem; }
  .info-row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .info-key { font-size: 0.8rem; color: var(--text-muted); flex-shrink: 0; }
  .info-val { font-size: 0.95rem; font-weight: 500; color: var(--navy); text-align: right; }
  .badge { display: inline-block; font-size: 0.8rem; font-weight: 700; padding: 0.2rem 0.75rem; border-radius: 999px; background: var(--navy); color: white; letter-spacing: 0.05em; }
  .gold-line { height: 3px; background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold)); }
  .total-section { padding: 1rem 1.5rem; background: var(--cream); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--cream-dark); }
  .total-label { font-size: 0.9rem; font-weight: 700; color: var(--navy); }
  .total-amount { font-family: 'Shippori Mincho', serif; font-size: 1.4rem; font-weight: 700; color: var(--gold); }
  .footer-note { margin-top: 1.5rem; text-align: center; font-size: 0.75rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 1rem; }
  .save-btn { display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; padding: 0.9rem; background: var(--navy); color: white; font-family: 'Noto Sans JP', sans-serif; font-size: 0.95rem; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; letter-spacing: 0.05em; transition: opacity 0.2s; }
  .save-btn:hover { opacity: 0.85; }
  .save-btn.loading { opacity: 0.6; pointer-events: none; }
  .save-btn svg { width: 18px; height: 18px; stroke: white; stroke-width: 2; fill: none; }
  .screenshot-notice {
    background: var(--navy);
    color: white;
    text-align: center;
    padding: 0.9rem 1.25rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 700;
    line-height: 1.8;
    margin-bottom: 1rem;
  }
  .screenshot-notice span { font-size: 0.72rem; font-weight: 400; opacity: 0.8; }
  .another-link { display: block; text-align: center; margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted); text-decoration: none; padding: 0.5rem; }
  .another-link:hover { color: var(--navy); text-decoration: underline; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="check-circle"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    <h1>申し込み完了</h1>
    <h2>ありがとうございます！</h2>
  </div>
  <div class="screenshot-notice">
    📸 この画面をスクリーンショットで保存してください<br>
    <span>iPhoneは「サイドボタン＋音量上」、Androidは「電源＋音量下」</span>
  </div>
  <div id="capture-area">
    <div class="card">
      <div class="gold-line"></div>
      <div class="card-section">
        <p class="section-label">Event</p>
        <p class="event-name">新松戸後打ち上げ</p>
        <div class="event-meta">
          <div class="meta-row"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>2026年7月19日（日）</div>
          <div class="meta-row"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>さかなや道場</div>
        </div>
      </div>
      <div class="card-section">
        <p class="section-label">申し込み内容</p>
        <div id="members-list"></div>
      </div>
      <div class="total-section">
        <span class="total-label">合計金額</span>
        <span class="total-amount" id="total-display"></span>
      </div>
      <div class="gold-line"></div>
    </div>
  </div>
  <p class="footer-note"><a class="another-link" href="https://busyu-musashi.github.io/event/lions_entry_form.html">別のメンバーの参加入力をする</a></p>
</div>
<script>
  var params = new URLSearchParams(window.location.search);
  var count = parseInt(params.get('count') || '1');
  var list = document.getElementById('members-list');
  var total = 0;

  for (var i = 0; i < count; i++) {
    var sei = params.get('sei' + i) || '';
    var mei = params.get('mei' + i) || '';
    var kana = params.get('kana' + i) || '';
    var type = params.get('type' + i) || '';
    var price = parseInt(params.get('price' + i) || '0');
    total += price;
    var priceLabel = price === 0 ? '無料' : '¥' + price.toLocaleString();
    var block = document.createElement('div');
    block.style.marginBottom = i < count - 1 ? '1rem' : '0';
    if (i < count - 1) { block.style.borderBottom = '1px solid #f4ead8'; block.style.paddingBottom = '1rem'; }
    block.innerHTML = (count > 1 ? '<p class="member-label">' + (i + 1) + '人目</p>' : '')
      + '<div class="info-grid">'
      + '<div class="info-row"><span class="info-key">お名前</span><span class="info-val">' + sei + ' ' + mei + '</span></div>'
      + '<div class="info-row"><span class="info-key">ふりがな</span><span class="info-val">' + kana + '</span></div>'
      + '<div class="info-row"><span class="info-key">区分</span><span class="info-val"><span class="badge">' + type + '</span></span></div>'
      + '<div class="info-row"><span class="info-key">金額</span><span class="info-val">' + priceLabel + '</span></div>'
      + '</div>';
    list.appendChild(block);
  }
  document.getElementById('total-display').textContent = total === 0 ? '無料' : '¥' + total.toLocaleString();

</script>
</body>
</html>
