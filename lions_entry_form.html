<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出席申込 | ライオンズ後打ち上げ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1a2744;
    --gold: #c9952a;
    --gold-light: #f0d07a;
    --cream: #fdf8ef;
    --cream-dark: #f4ead8;
    --text-muted: #6b7a99;
    --error: #c0392b;
  }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .page { width: 100%; max-width: 480px; }

  .header { text-align: center; margin-bottom: 2rem; }
  .header h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 0.5rem;
  }
  .event-meta { display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.75rem; }
  .meta-row { display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.875rem; color: var(--text-muted); }
  .meta-row svg { width: 13px; height: 13px; stroke: var(--gold); stroke-width: 2; fill: none; flex-shrink: 0; }

  .card { background: white; border-radius: 12px; overflow: hidden; border: 1px solid var(--cream-dark); }
  .gold-line { height: 3px; background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold)); }
  .card-body { padding: 1.5rem; }

  .form-group { margin-bottom: 1.25rem; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.25rem; }
  label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--navy); margin-bottom: 0.4rem; }
  label .required { color: var(--gold); margin-left: 3px; }
  input[type="text"] {
    width: 100%;
    padding: 0.65rem 0.85rem;
    border: 1px solid var(--cream-dark);
    border-radius: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.95rem;
    color: var(--navy);
    background: var(--cream);
    transition: border-color 0.2s;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--gold); background: white; }

  .radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .radio-item { position: relative; }
  .radio-item input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
  .radio-item label {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.6rem;
    border: 1px solid var(--cream-dark);
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 400;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    background: var(--cream);
  }
  .radio-item input[type="radio"]:checked + label {
    border-color: var(--navy);
    background: var(--navy);
    color: white;
    font-weight: 500;
  }

  .submit-btn {
    width: 100%;
    padding: 0.9rem;
    background: var(--navy);
    color: white;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.2s;
    margin-top: 0.5rem;
  }
  .submit-btn:hover { opacity: 0.85; }
  .submit-btn:active { opacity: 0.7; }
  .submit-btn.loading { opacity: 0.6; pointer-events: none; }

  .error-msg { font-size: 0.75rem; color: var(--error); margin-top: 0.3rem; display: none; }
  .has-error input, .has-error .radio-group { outline: 1px solid var(--error); border-radius: 8px; }
  .has-error .error-msg { display: block; }

  .section-label { font-size: 0.7rem; font-weight: 700; color: var(--gold); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 1rem; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>ライオンズ後打ち上げ</h1>
    <p style="font-size:0.8rem;color:var(--text-muted);">出席申込フォーム</p>
    <div class="event-meta">
      <div class="meta-row">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        2026年7月18日（土）
      </div>
      <div class="meta-row">
        <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        さかなや道場
      </div>
    </div>
  </div>

  <div class="card">
    <div class="gold-line"></div>
    <div class="card-body">
      <p class="section-label">申し込み情報</p>

      <div class="form-row">
        <div class="form-group" id="group-sei">
          <label>姓<span class="required">*</span></label>
          <input type="text" id="sei" placeholder="山田">
          <p class="error-msg">入力してください</p>
        </div>
        <div class="form-group" id="group-mei">
          <label>名<span class="required">*</span></label>
          <input type="text" id="mei" placeholder="花子">
          <p class="error-msg">入力してください</p>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group" id="group-sei-kana">
          <label>せい<span class="required">*</span></label>
          <input type="text" id="sei-kana" placeholder="やまだ">
          <p class="error-msg">入力してください</p>
        </div>
        <div class="form-group" id="group-mei-kana">
          <label>めい<span class="required">*</span></label>
          <input type="text" id="mei-kana" placeholder="はなこ">
          <p class="error-msg">入力してください</p>
        </div>
      </div>

      <div class="form-group" id="group-type">
        <label>区分<span class="required">*</span></label>
        <div class="radio-group">
          <div class="radio-item">
            <input type="radio" name="type" id="type-adult" value="大人">
            <label for="type-adult">大人</label>
          </div>
          <div class="radio-item">
            <input type="radio" name="type" id="type-junior" value="ジュニア">
            <label for="type-junior">ジュニア</label>
          </div>
          <div class="radio-item">
            <input type="radio" name="type" id="type-kids" value="キッズ">
            <label for="type-kids">キッズ</label>
          </div>
          <div class="radio-item">
            <input type="radio" name="type" id="type-moc" value="MOC">
            <label for="type-moc">MOC</label>
          </div>
        </div>
        <p class="error-msg">選択してください</p>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitForm()">申し込む</button>
    </div>
    <div class="gold-line"></div>
  </div>
</div>

<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbz8cnRBdC2bAabMMszJfsvNMUCn3i0VZRStq7qYGbnoQ1VUbR8DuIRRuVfpvjTFdjc/exec';

  function submitForm() {
    var sei = document.getElementById('sei').value.trim();
    var mei = document.getElementById('mei').value.trim();
    var seiKana = document.getElementById('sei-kana').value.trim();
    var meiKana = document.getElementById('mei-kana').value.trim();
    var typeEl = document.querySelector('input[name="type"]:checked');
    var type = typeEl ? typeEl.value : '';

    var valid = true;
    var fields = [
      { id: 'group-sei', val: sei },
      { id: 'group-mei', val: mei },
      { id: 'group-sei-kana', val: seiKana },
      { id: 'group-mei-kana', val: meiKana },
    ];
    fields.forEach(function(f) {
      var el = document.getElementById(f.id);
      if (!f.val) { el.classList.add('has-error'); valid = false; }
      else { el.classList.remove('has-error'); }
    });
    var typeGroup = document.getElementById('group-type');
    if (!type) { typeGroup.classList.add('has-error'); valid = false; }
    else { typeGroup.classList.remove('has-error'); }

    if (!valid) return;

    var btn = document.getElementById('submitBtn');
    btn.classList.add('loading');
    btn.textContent = '送信中...';

    var data = { sei: sei, mei: mei, sei_kana: seiKana, mei_kana: meiKana, type: type };

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(data)
    })
    .then(function(res) { return res.json(); })
    .then(function(json) {
      if (json.redirect) {
        window.location.href = json.redirect;
      }
    })
    .catch(function() {
      btn.classList.remove('loading');
      btn.textContent = '申し込む';
      alert('エラーが発生しました。もう一度お試しください。');
    });
  }
</script>
</body>
</html>
